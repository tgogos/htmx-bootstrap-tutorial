    <li class="breadcrumb-item"><a href="/ui/patterns">Patterns</a></li>
    {% if lesson == 0 %}
    <li class="breadcrumb-item active" aria-current="page">Start</li>
    {% else %}
    <li class="breadcrumb-item active" aria-current="page">{{ lesson }}</li>
    {% endif %}
  </ol>
  <div class="d-flex flex-wrap gap-2">
    <a class="btn btn-sm {% if lesson == 1 %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="/ui/patterns/1">1 · Select</a>
