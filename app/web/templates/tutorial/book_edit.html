<form
  class="card"
  hx-put="/ui/tutorial/books/{{ book.id }}"
  hx-target="#practice-slot"
  hx-swap="innerHTML"
>
  <div class="card-body">
    {% if message %}
    <div class="alert alert-danger" role="alert">{{ message }}</div>
    {% endif %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="mb-3">
      <label class="form-label" for="edit-title">Title</label>
      <input class="form-control" id="edit-title" type="text" name="title" value="{{ book.title }}" maxlength="200">
    </div>
    <div class="mb-3">
      <label class="form-label" for="edit-author">Author</label>
      <input class="form-control" id="edit-author" type="text" name="author" value="{{ book.author }}" maxlength="200">
    </div>
    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-primary" type="submit">Save</button>
      <button
        type="button"
        class="btn btn-outline-secondary"
        hx-get="/ui/tutorial/books/{{ book.id }}/card?panel=practice"
        hx-target="#practice-slot"
        hx-swap="innerHTML"
      >Cancel</button>
    </div>
  </div>
</form>
